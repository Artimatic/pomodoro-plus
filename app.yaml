runtime: custom
env: flex

# Allocate resources according to your application size
resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 4
  cpu_utilization:
    target_utilization: 0.65

# Inject production environment variables here
env_variables:
  NODE_ENV: 'production'
  # DATABASE_URL: 'YOUR_DATABASE_CONNECTION_STRING'